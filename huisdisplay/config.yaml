name: Huisdisplay
version: "0.6.4"
slug: huisdisplay
description: Hub for the Huisdisplay e-paper screen (pages, rain, trains, calendar, voice with Claude)
url: https://github.com/twetering/huisdisplay-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
stdin: true
map:
  - share:ro
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Display API and page previews
ingress: true
ingress_port: 8787
panel_icon: mdi:tablet-dashboard
panel_title: Huisdisplay
options:
  anthropic_api_key: ""
  stt_provider: elevenlabs
  elevenlabs_api_key: ""
  openai_api_key: ""
  ns_api_key: ""
  ns_station: ""
  ns_station_name: ""
  ns_to: ""
  ns_toward: ""
  gcal_ics: ""
  postcode: ""
  housenumber: ""
  place: ""
  weather_entity: weather.forecast_home
  shopping_list: todo.shopping_list
  reminders_list: todo.huishouden
  dinner_auto: false
  dinner_prefs: "gezin met een jong kind, afwisselend, gewone avondmaaltijd"
  strava_client_id: ""
  strava_client_secret: ""
  birthdays: ""
  chime_volume: 2
  quiet_start: "21:30"
  quiet_end: "07:00"
  speak_answers: true
  tts_voice: XrExE9yKIg1WjnnlVkGX
  announce_delays: true
  announcer_voice: onwK4e9ZLuTAKqWW03F9
  announce_min_delay: 1
  announce_trains: ""
  announce_lead: 45
  announce_interval: 1
  announcer_stability: 0.2
  announcer_similarity: 0.95
  podcasts: ""
  news_feed: https://feeds.nos.nl/nosnieuwsalgemeen
  countdowns: "🎁 Pakjesavond|12-05|21, 🎄 Kerst|12-25|19"
schema:
  anthropic_api_key: password?
  stt_provider: list(elevenlabs|openai)
  elevenlabs_api_key: password?
  openai_api_key: password?
  ns_api_key: password?
  ns_station: str?
  ns_station_name: str?
  ns_to: str?
  ns_toward: str?
  gcal_ics: password?
  postcode: str?
  housenumber: str?
  place: str?
  weather_entity: str
  shopping_list: str
  reminders_list: str
  dinner_auto: bool
  dinner_prefs: str?
  strava_client_id: str?
  strava_client_secret: password?
  birthdays: str?
  countdowns: str?
  chime_volume: int(0,3)
  quiet_start: match(^\d{2}:\d{2}$)
  quiet_end: match(^\d{2}:\d{2}$)
  speak_answers: bool
  tts_voice: str
  announce_delays: bool
  announcer_voice: str
  podcasts: str?
  news_feed: url
  announce_min_delay: int(0,30)
  announcer_stability: float(0,1)
  announcer_similarity: float(0,1)
  announce_trains: str?
  announce_lead: int(5,120)
  announce_interval: int(1,15)
